<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div class="grid-wrapper">
      <!-- NAVBAR -->
      <header class="nav-bar">
        <img
          src="assets/zamas-logo.png"
          alt="Zama's Organic skincare Logo"
          class="logo"
        />

        <img src="assets/menu-icon.png" id="btn-menu" alt="Open Menu" />
      </header>

      <!-- SIDEBAR -->
      <aside class="sidebar-list">
        <div class="menu-item">
          <img
            src="assets/icons-close-sidebar.gif"
            id="btn-close-sidebar"
            alt="Close Sidebar"
          />
        </div>

        <div class="menu-item">
          <a href="index.html">
            <img src="assets/icons-home.png" alt="Home" />
            <span>Home</span>
          </a>
        </div>

        <div class="menu-item">
          <a href="index.html#catalogue-section">
            <img src="assets/icons-catalogue.png" alt="Catalogue" />
            <span>Catalogue</span>
          </a>
        </div>

        <div class="menu-item">
          <a href="cart.html">
            <img src="assets/icons-cart.png" alt="Cart" />
            <span>Cart</span>
          </a>
        </div>

        <div class="menu-item">
          <a href="#our-story">
            <img src="assets/icons-about.png" alt="About" />
            <span>About</span>
          </a>
        </div>
      </aside>

      <!-- CHECKOUT SECTION -->
      <main class="products-wrapper">
        <h2>Checkout</h2>
        <hr />

        <h3>Billing Details</h3>

        <p class="grey-paragraph">We only utilize Paxi for deliveries</p>

        <form class="form">
          <input type="text" id="firstName" placeholder="First name" required />
          <input type="text" id="lastName" placeholder="Last name" required />
          <input
            type="text"
            id="cellNumber"
            placeholder="Phone number"
            required
          />
          <input type="text" id="paxiCode" placeholder="Paxi code" required />

          <label for="paxiDays">Choose Paxi days:</label>
          <select id="paxiDays">
            <option value="60">7 - 9 Days (R60)</option>
            <option value="100">3 - 5 Days (R100)</option>
          </select>

          <div class="btn-place-order-wrapper">
            <button type="submit" id="btnPlaceOrder">Place Order</button>
          </div>
        </form>
      </main>

      <!-- ORDER SUMMARY -->
      <section class="order-summary">
        <h4>Order Summary</h4>

        <div id="order-summary"></div>

        <h4>Order Total:</h4>
        <p id="orderTotal">0</p>
      </section>

      <!-- FOOTER -->
      <footer class="footer">
        <div class="footer-wrapper">
          <p class="footer-header">Contact us</p>

          <img src="assets/whatsapp-logo.png" alt="WhatsApp logo" />

          <p class="cell-number">083-725-7917</p>

          <p class="footer-text">
            © Zama’s Organic Skincare | Developed with 🤍 by
            <a href="https://siyabonga-zindela-portfolio.netlify.app/">
              Siyabonga Zindela
            </a>
          </p>
        </div>
      </footer>
    </div>

    <script defer src="js/main.js"></script>
  </body>
</html>
